name: Daily Applicant Scoring Pipeline

on:
  schedule:
    # Runs daily at 09:00 AM IST (03:30 UTC).
    # GitHub Actions is the PRIMARY daily automation platform.
    # Do NOT enable the Windows Task Scheduler backup at the same time.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in safe dry-run mode (no live Groq API calls and no Coda writes)"
        required: false
        default: false
        type: boolean
      limit:
        description: "Optional maximum number of eligible applicants to process (positive integer)"
        required: false
        default: ""
        type: string

# Minimum required repository permissions (read-only code checkout)
permissions:
  contents: read

# Prevent overlapping GitHub Actions runs without cancelling an active batch mid-flight
concurrency:
  group: daily-applicant-scoring-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Score New Applicants
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Provision temporary Google Service Account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          CRED_FILE="${RUNNER_TEMP}/google-service-account.json"
          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Required secret GOOGLE_SERVICE_ACCOUNT_JSON is not set."
            exit 1
          fi
          umask 077
          printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > "${CRED_FILE}"
          chmod 600 "${CRED_FILE}"
          python -c "
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          data = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(data, dict) or data.get('type') != 'service_account':
              raise SystemExit('Invalid service_account JSON structure.')
          " "${CRED_FILE}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${CRED_FILE}" >> "${GITHUB_ENV}"
          echo "Provisioned temporary service account credentials file (contents redacted)."

      - name: Execute Daily Applicant Scoring Pipeline
        env:
          APP_ENV: production
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
          CODA_DOC_ID: ${{ secrets.CODA_DOC_ID }}
          CODA_TABLE_ID: ${{ secrets.CODA_TABLE_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail

          for required_var in GROQ_API_KEY CODA_API_TOKEN CODA_DOC_ID CODA_TABLE_ID GOOGLE_SHEETS_ID GOOGLE_APPLICATION_CREDENTIALS; do
            if [ -z "${!required_var:-}" ]; then
              echo "::error::Required secret/environment variable ${required_var} is missing."
              exit 1
            fi
          done

          if [ -z "${GROQ_MODEL:-}" ]; then
            export GROQ_MODEL="openai/gpt-oss-120b"
          fi

          ARGS=()
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_DRY_RUN}" = "true" ]; then
              ARGS+=("--dry-run")
            fi
            if [ -n "${INPUT_LIMIT:-}" ]; then
              if [[ ! "${INPUT_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Invalid limit input '${INPUT_LIMIT}'. Must be a positive integer."
                exit 1
              fi
              ARGS+=("--limit" "${INPUT_LIMIT}")
            fi
          fi

          echo "Starting pipeline runner (event=${EVENT_NAME}, args=${ARGS[*]:-none})"
          python run_pipeline.py "${ARGS[@]}"

      - name: Clean up temporary credentials
        if: always()
        run: |
          CRED_FILE="${RUNNER_TEMP}/google-service-account.json"
          if [ -f "${CRED_FILE}" ]; then
            rm -f "${CRED_FILE}"
            echo "Removed temporary service account credentials file."
          fi
